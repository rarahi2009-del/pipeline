<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Content Calendar Pipeline</title>
<meta name="theme-color" content="#c41fa3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pipeline">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Bright Spring palette: magenta accent, periwinkle = main channel (R&C), orange = vlog channel (Ep.),
   coral = Shorts, soft pink as the ground tint. Deeper shades of each are used wherever text sits on them. */
:root {
  --bg: #fbf5f8;
  --surface: #ffffff;
  --surface-2: #f6eaf1;
  --line: #eddce5;
  --line-2: #dcc6d2;
  --ink: #2a1f26;
  --ink-2: #5d4f58;
  --ink-3: #8c7d86;
  --accent: #c41fa3;
  --accent-ink: #ffffff;
  --accent-soft: #fde3f7;
  --focus: #c41fa3;

  --ok: #3b8450; --risk: #b8650c; --behind: #c8363c;

  --ch-LWRC: #889fd1; --ch-RTL: #ff8110;
  --id-LWRC-fg: #344f8f; --id-LWRC-bg: #e4e9f6;
  --id-RTL-fg: #9c4a00; --id-RTL-bg: #ffe7d3;
  --id-short-fg: #b02a30; --id-short-bg: #fee1e2;
  --id-idea-fg: #a1168a; --id-idea-bg: #fde3f7;

  --t-filming: #2a9d8f; --t-myEdit: #8a6fd1; --t-handoff: #6d86a8; --t-editorProd: #a8b4d4;
  --t-review: #d9a520; --t-upload: #4e9a52; --t-publish: #2a1f26; --t-shorts: #fe40d8;
  --t-vlog: #ff8110; --t-buffer: #b3a7ae;

  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r: 10px;
  --r-sm: 7px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
  --bg: #1a1418; --surface: #221b20; --surface-2: #2d242a; --line: #3a2f36; --line-2: #4b3e46;
  --ink: #f4ecf1; --ink-2: #c7b8c1; --ink-3: #978892; --accent: #ff72e1; --accent-ink: #2b0623; --accent-soft: #4a1c41; --focus: #ff72e1;
  --ok: #78c08e; --risk: #f0a54e; --behind: #ff7b80;
  --ch-LWRC: #a3b6e2; --ch-RTL: #ff9a45;
  --id-LWRC-fg: #c9d5f2; --id-LWRC-bg: #2f3a55; --id-RTL-fg: #ffc996; --id-RTL-bg: #4d2c12;
  --id-short-fg: #ffb3b6; --id-short-bg: #4f2124; --id-idea-fg: #ffb0ee; --id-idea-bg: #4a1c41;
  --t-filming: #5cc6b8; --t-myEdit: #b29df0; --t-handoff: #9ab0cf; --t-editorProd: #c0cae5;
  --t-review: #ecc350; --t-upload: #86c389; --t-publish: #f4ecf1; --t-shorts: #ff72e1; --t-vlog: #ff9a45; --t-buffer: #8a7e85;
  color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1418; --surface: #221b20; --surface-2: #2d242a; --line: #3a2f36; --line-2: #4b3e46;
  --ink: #f4ecf1; --ink-2: #c7b8c1; --ink-3: #978892; --accent: #ff72e1; --accent-ink: #2b0623; --accent-soft: #4a1c41; --focus: #ff72e1;
  --ok: #78c08e; --risk: #f0a54e; --behind: #ff7b80;
  --ch-LWRC: #a3b6e2; --ch-RTL: #ff9a45;
  --id-LWRC-fg: #c9d5f2; --id-LWRC-bg: #2f3a55; --id-RTL-fg: #ffc996; --id-RTL-bg: #4d2c12;
  --id-short-fg: #ffb3b6; --id-short-bg: #4f2124; --id-idea-fg: #ffb0ee; --id-idea-bg: #4a1c41;
  --t-filming: #5cc6b8; --t-myEdit: #b29df0; --t-handoff: #9ab0cf; --t-editorProd: #c0cae5;
  --t-review: #ecc350; --t-upload: #86c389; --t-publish: #f4ecf1; --t-shorts: #ff72e1; --t-vlog: #ff9a45; --t-buffer: #8a7e85;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
code, .mono { font-family: var(--f-mono); font-size: 0.86em; letter-spacing: -0.01em; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(1.6rem, 1.2rem + 1.4vw, 2.2rem); font-weight: 650; line-height: 1.15; }
h2 { font-size: 1.08rem; font-weight: 620; }
h3 { font-size: 0.95rem; font-weight: 600; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.muted { color: var(--ink-3); }
.small { font-size: 0.84rem; }
.strong { font-weight: 600; }
.bad { color: var(--behind); }
.block { display: block; }
.grow { flex: 1 1 auto; min-width: 0; }

/* Shell */
.shell { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 100%; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; display: flex; flex-direction: column; gap: 2px; padding: 20px 12px; border-right: 1px solid var(--line); background: var(--surface); }
.brand { display: flex; gap: 10px; align-items: center; padding: 4px 10px 18px; }
.brand-mark { color: var(--accent); font-size: 1.3rem; line-height: 1; }
.brand strong { font-family: var(--f-display); font-size: 1.1rem; display: block; line-height: 1.1; }
.brand small { color: var(--ink-3); font-size: 0.78rem; }
.nav-btn { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border: 0; background: none; border-radius: var(--r-sm); cursor: pointer; color: var(--ink-2); text-align: left; font-weight: 500; }
.nav-btn svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.nav-btn:hover { background: var(--surface-2); color: var(--ink); }
.nav-btn.on { background: var(--accent); color: var(--accent-ink); }
.sync { margin-top: auto; display: flex; gap: 8px; align-items: flex-start; font-size: 0.78rem; color: var(--ink-3); padding: 10px; line-height: 1.35; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); margin-top: 4px; flex: none; }
.sync-account .dot { background: var(--ok); }
.sync-local .dot { background: var(--risk); }
.sync-error .dot { background: var(--behind); }
.main { min-width: 0; padding: 28px clamp(16px, 3vw, 40px) 64px; }
.page { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.page > * { min-width: 0; max-width: 100%; }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.eyebrow { text-transform: uppercase; letter-spacing: 0.09em; font-size: 0.72rem; font-weight: 600; color: var(--ink-3); margin-bottom: 4px; }
.lede { color: var(--ink-2); max-width: 68ch; }
.head-status { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* Controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line-2); background: var(--surface); padding: 7px 13px; border-radius: var(--r-sm); cursor: pointer; font-weight: 550; font-size: 0.9rem; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--ink-3); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { background: var(--behind); border-color: var(--behind); color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.sm { padding: 4px 9px; font-size: 0.82rem; }
.btn.icon { width: 34px; padding: 6px 0; font-size: 1.15rem; line-height: 1; }
.file-btn { position: relative; overflow: hidden; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.link { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; text-align: left; text-decoration: underline; text-decoration-color: color-mix(in oklab, var(--accent) 35%, transparent); text-underline-offset: 2px; }
.link.plain { color: inherit; text-decoration: none; }
.link.plain:hover { text-decoration: underline; }
.icon-btn { border: 0; background: var(--surface-2); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; flex: none; }
.input { width: 100%; border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--r-sm); padding: 7px 10px; min-width: 0; }
.input.sm { padding: 4px 8px; font-size: 0.86rem; width: auto; }
.input.num { width: 90px; font-variant-numeric: tabular-nums; }
.input.ghost-in { border-color: transparent; background: transparent; width: 100%; min-width: 160px; }
.input.ghost-in:hover, .input.ghost-in:focus { border-color: var(--line-2); background: var(--surface); }
.input.date { width: 136px; }
textarea.input { resize: vertical; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: var(--r-sm); padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg-btn { border: 0; background: transparent; padding: 5px 11px; border-radius: 5px; cursor: pointer; font-size: 0.86rem; font-weight: 550; color: var(--ink-2); }
.seg-btn.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / 0.12); }
.check { position: relative; display: inline-flex; align-items: center; gap: 7px; cursor: pointer; font-size: 0.88rem; user-select: none; }
.check input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.check .box { width: 18px; height: 18px; border: 1.5px solid var(--line-2); border-radius: 5px; background: var(--surface); flex: none; display: grid; place-items: center; }
.check input:checked + .box { background: var(--accent); border-color: var(--accent); }
.check input:checked + .box::after { content: ""; width: 9px; height: 5px; border-left: 2px solid var(--accent-ink); border-bottom: 2px solid var(--accent-ink); transform: rotate(-45deg) translate(1px, -1px); }
.check input:focus-visible + .box { outline: 2px solid var(--focus); outline-offset: 2px; }
.check.disabled { opacity: 0.45; cursor: not-allowed; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field-label { font-size: 0.78rem; font-weight: 600; color: var(--ink-2); letter-spacing: 0.01em; }
.field-hint { font-size: 0.78rem; color: var(--ink-3); }
.field-error { font-size: 0.8rem; color: var(--behind); }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.row4 { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px 16px; }
.inline { display: flex; gap: 8px; align-items: center; }
.inline.wrap { flex-wrap: wrap; }
.nowrap { flex-wrap: nowrap; }
.checks-row { display: flex; flex-wrap: wrap; gap: 10px 18px; }

/* Pills, tags */
.pill { display: inline-flex; align-items: center; font-size: 0.75rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; border: 1px solid transparent; }
.pill-ok { color: var(--ok); background: color-mix(in oklab, var(--ok) 13%, var(--surface)); }
.pill-risk { color: var(--risk); background: color-mix(in oklab, var(--risk) 15%, var(--surface)); }
.pill-behind { color: var(--behind); background: color-mix(in oklab, var(--behind) 14%, var(--surface)); }
.pill-muted { color: var(--ink-2); background: var(--surface-2); }
.pill-ink { color: var(--ink); border-color: var(--line-2); }
.ch { font-size: 0.72rem; font-weight: 650; letter-spacing: 0.02em; padding: 1px 6px; border-radius: 4px; color: #1d1620; }
.ch-LWRC { background: var(--ch-LWRC); } .ch-RTL { background: var(--ch-RTL); }
.abc { font-size: 0.72rem; font-weight: 650; padding: 1px 7px; border-radius: 4px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 8px; vertical-align: 1px; }
.sw-LWRC { background: var(--ch-LWRC); } .sw-RTL { background: var(--ch-RTL); }
.ch-band-LWRC { --band: var(--ch-LWRC); } .ch-band-RTL { --band: var(--ch-RTL); }
.tiny-tag { font-size: 0.68rem; margin-left: 6px; padding: 0 5px; border-radius: 3px; background: var(--surface-2); color: var(--ink-2); }
.tag-step { font-size: 0.74rem; font-weight: 600; color: var(--ink-2); background: var(--surface-2); padding: 2px 8px; border-radius: 4px; white-space: nowrap; }
.date-chip { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 0.84rem; white-space: nowrap; min-width: 84px; }
.warn { color: var(--risk); font-size: 0.86rem; }
.count { font-family: var(--f-body); font-size: 0.75rem; color: var(--ink-3); font-weight: 600; margin-left: 4px; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.grid-dash { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; }
.today-card { grid-column: span 7; }
.next-card { grid-column: span 5; }
.health-card { grid-column: span 12; }
.pipe-card { grid-column: span 12; }
.grid-dash > .card:not(.today-card):not(.next-card):not(.health-card):not(.pipe-card):not(.stats-card) { grid-column: span 6; }
.stats-card { grid-column: span 12; flex-direction: row; flex-wrap: wrap; padding: 0; gap: 0; overflow: hidden; }
.load { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--ink-2); }
.load.over { color: var(--behind); }
.task-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.task-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 8px 10px 8px 12px; border-radius: var(--r-sm); background: var(--surface-2); position: relative; }
.task-row::before { content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 3px; border-radius: 2px; background: var(--tc); }
.task-row.done .task-title { text-decoration: line-through; color: var(--ink-3); }
.task-main { border: 0; background: none; padding: 0; text-align: left; cursor: pointer; min-width: 0; display: flex; flex-direction: column; }
.task-title { font-weight: 550; }
.task-meta { font-size: 0.8rem; color: var(--ink-3); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.task-hrs { font-variant-numeric: tabular-nums; font-size: 0.84rem; color: var(--ink-2); }
.spacer-check { width: 18px; }
.recs { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 14px; }
.recs li { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; }
.rec-n { width: 26px; height: 26px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 0.82rem; font-family: var(--f-display); }
.health-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.health { border-top: 3px solid var(--band); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.health-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.issues { margin: 0; padding-left: 16px; display: flex; flex-direction: column; gap: 5px; font-size: 0.86rem; }
.issues li::marker { color: var(--ink-3); }
.issues button { display: inline; text-align: left; font-size: inherit; line-height: inherit; }
.issue-behind { color: var(--behind); }
.issue-risk { color: var(--ink); }
.issue-risk::marker { color: var(--risk) !important; }
.pipe { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1180px) { .pipe { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.pipe-col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.pipe-col h3 { font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); font-family: var(--f-body); font-weight: 650; }
.pipe-item { text-align: left; border: 1px solid var(--line); border-left: 4px solid var(--band); background: var(--surface); border-radius: var(--r-sm); padding: 9px 10px; display: flex; flex-direction: column; gap: 3px; cursor: pointer; min-width: 0; }
.pipe-item:hover { border-color: var(--line-2); border-left-color: var(--band); }
.pipe-id { display: flex; gap: 6px; align-items: center; }
.pipe-title { font-weight: 550; font-size: 0.9rem; line-height: 1.3; overflow-wrap: anywhere; }
.plain-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; }
.plain-list li + li { border-top: 1px solid var(--line); }
.row-btn { width: 100%; display: flex; gap: 10px; align-items: baseline; border: 0; background: none; text-align: left; padding: 9px 2px; cursor: pointer; }
.row-btn:hover .grow { text-decoration: underline; text-decoration-color: var(--line-2); }
.stat { flex: 1 1 200px; display: flex; flex-direction: column; gap: 2px; padding: 16px 18px; border: 0; background: none; text-align: left; cursor: pointer; border-right: 1px solid var(--line); }
.stat:last-child { border-right: 0; }
.stat:hover:not(.static) { background: var(--surface-2); }
.stat.static { cursor: default; }
.stat-n { font-family: var(--f-display); font-size: 2rem; font-weight: 650; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stat-l { font-weight: 600; font-size: 0.88rem; }
.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stat-row .stat { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; }

/* Task colors */
.t-filming { --tc: var(--t-filming); } .t-myEdit { --tc: var(--t-myEdit); } .t-handoff { --tc: var(--t-handoff); }
.t-editorProd { --tc: var(--t-editorProd); } .t-review { --tc: var(--t-review); } .t-upload { --tc: var(--t-upload); }
.t-publish { --tc: var(--t-publish); } .t-shorts { --tc: var(--t-shorts); } .t-vlog { --tc: var(--t-vlog); } .t-buffer { --tc: var(--t-buffer); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.78rem; color: var(--ink-2); }
.lg { display: inline-flex; align-items: center; gap: 6px; }
.lg i { width: 10px; height: 10px; border-radius: 3px; background: var(--tc); }
.tsub { display: inline-flex; align-items: center; gap: 7px; flex-wrap: wrap; }
.tsub i { width: 10px; height: 10px; border-radius: 3px; background: var(--tc); display: inline-block; }

/* Calendar */
.cal-bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.nav-group, .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.report { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 16px; font-size: 0.88rem; }
.report summary { cursor: pointer; }
.report ul { margin: 8px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
.report .overflow li { color: var(--risk); }
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--line); gap: 1px; }
.dow-head { background: var(--surface-2); padding: 6px 8px; font-size: 0.74rem; font-weight: 650; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-2); }
.day { background: var(--surface); min-height: 118px; padding: 6px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.day.other { background: color-mix(in oklab, var(--surface) 55%, var(--bg)); }
.day.other .day-num { color: var(--ink-3); }
.day.off, .day.buffer { background-image: repeating-linear-gradient(135deg, transparent 0 7px, color-mix(in oklab, var(--line) 55%, transparent) 7px 8px); }
.day.is-today { box-shadow: inset 0 0 0 2px var(--accent); }
.day-head { display: flex; justify-content: space-between; align-items: center; gap: 4px; }

.chip-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.chip-h { flex: none; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.chip.done { opacity: 0.55; }

.chip.skipped { opacity: 0.4; }
.chip.span { background: transparent; border-left-style: dashed; }

.more { border: 0; background: none; font-size: 0.72rem; color: var(--ink-2); cursor: pointer; text-align: left; padding: 1px 6px; }
.add-here { border: 1px dashed var(--line-2); background: none; border-radius: 4px; font-size: 0.74rem; color: var(--ink-3); padding: 3px 6px; cursor: pointer; text-align: left; }

.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }

.week .chip { white-space: normal; }

.agenda { display: flex; flex-direction: column; gap: 8px; }

/* Drawer + modal */

.drawer-titles { min-width: 0; display: flex; flex-direction: column; gap: 6px; }

.modal { background: var(--surface); border-radius: var(--r); padding: 22px; width: min(520px, 100%); max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 50px rgb(0 0 0 / 0.25); }

.row-actions { display: flex; justify-content: flex-end; gap: 8px; }
.linked { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.linked-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mini-shorts { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
.mini-shorts li { display: flex; flex-direction: column; gap: 4px; }
.step-row { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.sec-h { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-2); font-family: var(--f-body); font-weight: 650; margin-top: 6px; }
.toasts { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 80; width: min(460px, calc(100% - 32px)); }
.toast { background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: var(--r-sm); font-size: 0.88rem; box-shadow: 0 8px 24px rgb(0 0 0 / 0.2); }
.toast.error { background: var(--behind); color: #fff; }

/* Long-form */
.vgroup { display: flex; flex-direction: column; gap: 12px; }
.vgroup-h { display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap; }

.vcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.vcard { text-align: left; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--band); border-radius: var(--r); padding: 14px; display: flex; flex-direction: column; gap: 9px; cursor: pointer; min-width: 0; }
.vcard:hover { border-color: var(--line-2); border-top-color: var(--band); }
.vcard-top { display: flex; align-items: center; gap: 8px; }
.vid { font-weight: 600; font-size: 0.86rem; }
.vcard-title { font-family: var(--f-display); font-weight: 600; font-size: 1.02rem; line-height: 1.3; overflow-wrap: anywhere; }
.vcard-meta { display: flex; flex-direction: column; gap: 2px; font-size: 0.86rem; }
.steps { display: flex; gap: 4px; }
.stepdot { flex: 1; height: 5px; border-radius: 3px; background: var(--surface-2); }
.stepdot.done { background: var(--band); }
.stepdot.cur { background: color-mix(in oklab, var(--band) 40%, var(--surface-2)); }
.ms-table { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r-sm); }

.ms-row + .ms-row { border-top: 1px solid var(--line); }
.ms-row.cur { background: color-mix(in oklab, var(--accent) 7%, var(--surface)); }
.ms-row.done .ms-name { color: var(--ink-3); }
.ms-row.skipped { opacity: 0.55; }
.ms-name { font-weight: 550; font-size: 0.9rem; }
.ms-dates { display: flex; gap: 4px; flex-wrap: wrap; }
.ms-acts { display: flex; gap: 10px; align-items: center; justify-content: flex-end; }
.ms-block { grid-column: 1 / -1; }
.links { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
.links li { display: flex; gap: 10px; justify-content: space-between; overflow-wrap: anywhere; }
.links a { color: var(--accent); }

/* Shorts */
.stage-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.stage-seg { flex: 1 0 104px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm); padding: 8px 10px; text-align: left; cursor: pointer; display: flex; flex-direction: column; }
.stage-seg.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.stage-seg .n { font-family: var(--f-display); font-weight: 650; font-size: 1.25rem; font-variant-numeric: tabular-nums; }
.stage-seg .l { font-size: 0.74rem; color: var(--ink-2); }
.bulk { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; background: var(--surface-2); padding: 8px 12px; border-radius: var(--r-sm); }
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.tbl { border-collapse: collapse; width: 100%; font-size: 0.86rem; }
.tbl th { text-align: left; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-2); padding: 9px 10px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.tbl td { padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }

.tbl .c { text-align: center; }
.tbl td:nth-child(2) { white-space: nowrap; }
.tbl .t-title { min-width: 200px; }
.tbl .needs { white-space: nowrap; }
.tbl .needs .check { margin-right: 10px; }
.tbl.avail tr.off td { opacity: 0.55; }
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 1fr); gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.board-col { background: var(--surface-2); border-radius: var(--r); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.board-col h3 { font-size: 0.82rem; font-family: var(--f-body); font-weight: 650; }
.kcard { background: var(--surface); border-radius: var(--r-sm); border: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.kchecks { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.kchecks .check { font-size: 0.8rem; }
.flow { display: flex; flex-direction: column; gap: 8px; border-left: 2px solid var(--line); padding-left: 14px; }
.flow-step.skip { opacity: 0.7; }

/* Vlogs */
.vlogs { display: flex; flex-direction: column; gap: 8px; }
.vlog { display: flex; justify-content: space-between; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--ch-RTL); border-radius: var(--r-sm); padding: 12px 14px; flex-wrap: wrap; }
.vlog.archived { opacity: 0.6; }
.vlog-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; flex: 1 1 260px; }
.vlog-acts { display: flex; gap: 8px; align-items: center; }
.empty { border: 1px dashed var(--line-2); border-radius: var(--r); padding: 26px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; color: var(--ink-2); }
.empty strong { color: var(--ink); font-family: var(--f-display); font-size: 1.05rem; }

/* Settings */
.settings .card h2 { margin-bottom: 2px; }
.date-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.date-tag { border: 1px solid var(--line-2); background: var(--surface-2); border-radius: 999px; padding: 2px 9px; font-size: 0.78rem; cursor: pointer; }

/* Responsive */
@media (max-width: 1080px) {
  .today-card, .next-card { grid-column: span 12; }
  .grid-dash > .card:not(.stats-card) { grid-column: span 12 !important; }
  .week { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  .health-list { grid-template-columns: minmax(0, 1fr); }
  .pipe { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .row3 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: auto; flex-direction: row; justify-content: space-around; padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px)); border-right: 0; border-top: 1px solid var(--line); z-index: 40; gap: 0; }
  .brand, .sync { display: none; }
  .nav-btn { flex-direction: column; gap: 2px; font-size: 0.66rem; padding: 6px 4px; flex: 1; align-items: center; min-width: 0; }
  .nav-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .main { padding: 18px 16px calc(92px + env(safe-area-inset-bottom, 0px)); }
  .week { grid-template-columns: minmax(0, 1fr); }
  .week .day { min-height: 0; }
  .row2 { grid-template-columns: minmax(0, 1fr); }
  .pipe { grid-template-columns: minmax(0, 1fr); }
  .stat { flex-basis: 50%; border-right: 0; border-bottom: 1px solid var(--line); }
  .ms-row { grid-template-columns: minmax(0, 1fr); }
  .ms-acts { justify-content: flex-start; }
  .toasts { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.dep-list { margin: 0; padding-left: 18px; }

/* Friendly IDs */
.vidid { display: inline-flex; align-items: center; font-family: var(--f-body); font-weight: 700; font-size: 0.78rem; letter-spacing: 0.01em; padding: 1px 7px; border-radius: 5px; white-space: nowrap; font-variant-numeric: tabular-nums; vertical-align: 1px; }
.vidid.big { font-size: 1rem; padding: 2px 9px; }
.id-LWRC { color: var(--id-LWRC-fg); background: var(--id-LWRC-bg); }
.id-RTL { color: var(--id-RTL-fg); background: var(--id-RTL-bg); }
.id-short { color: var(--id-short-fg); background: var(--id-short-bg); }
.id-idea { color: var(--id-idea-fg); background: var(--id-idea-bg); }
.id-other { color: var(--ink-2); background: var(--surface-2); }
.chip-id.id-LWRC, .chip-id.id-RTL, .chip-id.id-short { background: none; font-family: var(--f-body); font-weight: 800; }
.chip-id.id-LWRC { color: var(--id-LWRC-fg); } .chip-id.id-RTL { color: var(--id-RTL-fg); } .chip-id.id-short { color: var(--id-short-fg); }
.t-publish.chip .chip-id { color: var(--bg) !important; }
.vcard-notes { font-size: 0.85rem; color: var(--ink-2); background: var(--surface-2); border-radius: var(--r-sm); padding: 7px 9px; white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.notes-box { min-height: 96px; }

/* Shorts editor */
.ed-tag { font-size: 0.7rem; font-weight: 700; padding: 0 6px; border-radius: 4px; margin-right: 4px; }
.ed-Rachel { color: var(--id-idea-fg); background: var(--id-idea-bg); }
.ed-Christian { color: var(--id-LWRC-fg); background: var(--id-LWRC-bg); }
select.ed-sel { font-weight: 600; border-color: transparent; }
.idea-pick-sm select { width: auto; max-width: 240px; padding: 5px 8px; font-size: 0.86rem; }

/* Ideas */
.quick-add { flex-direction: column; }
.quick-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.search { width: min(260px, 100%); }
.ideas { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.idea { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.idea.used { opacity: 0.6; }
.idea-main { border: 0; background: none; padding: 0; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.idea-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.idea-title { font-family: var(--f-display); font-weight: 600; font-size: 1rem; line-height: 1.3; overflow-wrap: anywhere; }
.idea-notes { font-size: 0.85rem; color: var(--ink-2); white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.kind-tag { font-size: 0.7rem; font-weight: 700; padding: 1px 7px; border-radius: 4px; }
.k-long { color: var(--id-LWRC-fg); background: var(--id-LWRC-bg); }
.k-short { color: var(--id-short-fg); background: var(--id-short-bg); }

/* Long-form thumbnails & table */
.vcard-thumb { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: var(--r-sm); background: var(--surface-2); max-width: 100%; }
.thumb-field { display: flex; flex-direction: column; gap: 8px; }
.thumb-field img, .thumb-ph { width: 100%; max-width: 360px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: var(--r-sm); }
.thumb-ph { display: grid; place-items: center; background: var(--surface-2); color: var(--ink-3); font-size: 0.85rem; border: 1px dashed var(--line-2); }
.file-btn.disabled { opacity: 0.6; pointer-events: none; }
.thumb-cell { width: 76px; }
.thumb-cell img, .thumb-empty { display: block; width: 64px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 4px; background: var(--surface-2); }
.click-row { cursor: pointer; }
.click-row:hover td { background: var(--surface-2); }
.vtbl .t-title { min-width: 220px; }
.nowrap { white-space: nowrap; }

/* Shorts order, city, next job */
.order-cell { white-space: nowrap; }
.order-n { display: inline-block; min-width: 1.6em; font-variant-numeric: tabular-nums; font-weight: 700; color: var(--ink-2); }

.ob:hover:not(:disabled) { color: var(--accent); background: var(--accent-soft); }
.ob:disabled { opacity: 0.25; cursor: default; }
tr.ooo td { background: color-mix(in oklab, var(--risk) 7%, var(--surface)); }
.next-cell { min-width: 150px; }
.next-cell .todo { display: block; margin-top: 3px; }
.todo { color: var(--ink-2); }
.place-tag { display: inline-block; font-size: 0.72rem; font-weight: 600; padding: 1px 7px; border-radius: 999px; color: var(--id-RTL-fg); background: var(--id-RTL-bg); white-space: nowrap; width: fit-content; }
.place-tag.general { color: var(--ink-2); background: var(--surface-2); }
.place-in { width: 120px !important; border-radius: 999px; font-size: 0.8rem; }
.place-in.set { color: var(--id-RTL-fg); background: var(--id-RTL-bg); border-color: transparent; font-weight: 600; }

.kcard .place-tag { margin-top: -2px; }
.vtbl td:nth-child(3) { white-space: nowrap; }

/* Dashboard plan block */
.plan-card { grid-column: span 12; }
.card-head.wrap { flex-wrap: wrap; }
.card-head h2 .muted { font-family: var(--f-body); font-weight: 500; margin-left: 6px; }
.pweek { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.pweek .day { border: 1px solid var(--line); border-radius: var(--r-sm); min-height: 150px; padding: 8px; }
.pweek .chip { flex-wrap: wrap; white-space: normal; }
.pweek .chip-t { white-space: normal; }
.chip-sub { flex-basis: 100%; font-size: 0.68rem; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pmonth .day { min-height: 92px; }
.rec-title { font-size: 0.85rem; color: var(--ink-2); margin-top: 1px; }
.row-sub { display: block; font-size: 0.8rem; color: var(--ink-3); }
.legend-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.lg-item { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; font-size: 0.9rem; }
@media (max-width: 1080px) { .pweek { grid-template-columns: repeat(2, minmax(0, 1fr)); } .plan-card { grid-column: span 12 !important; } }
@media (max-width: 860px) { .legend-grid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) { .pweek { grid-template-columns: minmax(0, 1fr); } .pweek .day { min-height: 0; } .pmonth .chip-t { display: none; } }
.grid-dash > .card.plan-card { grid-column: 1 / -1 !important; }
.thumb-field img, .thumb-ph { max-width: 240px; }
.auto-tag { display: inline-block; margin-left: 6px; font-size: 0.66rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 0 5px; border-radius: 4px; color: var(--accent); background: var(--accent-soft); vertical-align: 1px; }

/* To film list */
.tofilm { border-left: 4px solid var(--accent); }
.film-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.film-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 8px; border-radius: var(--r-sm); background: var(--surface-2); }
.film-row.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
.film-row.late { background: color-mix(in oklab, var(--behind) 9%, var(--surface)); }
.film-main { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.film-main .ghost-in { font-weight: 600; min-width: 0; }
.film-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.film-done { white-space: nowrap; }
.film-add { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.film-add #film-new { flex: 1 1 220px; }
.icon-btn.sm { width: 26px; height: 26px; font-size: 0.75rem; }
.film-tag { font-size: 0.72rem; font-weight: 700; color: var(--accent); }
.film-soon { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
.film-soon-head { display: flex; justify-content: space-between; align-items: center; }
.film-soon ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 0.9rem; }
.film-soon .small { display: inline-block; min-width: 72px; }

/* Compact phone layout */
@media (max-width: 760px) {
  body { font-size: 14px; }
  h1 { font-size: 1.35rem; }
  h2 { font-size: 0.98rem; }
  .eyebrow { font-size: 0.64rem; margin-bottom: 2px; }
  .page { gap: 12px; }
  .page-head { gap: 8px; align-items: flex-start; }
  .grid-dash { gap: 10px; }
  .card { padding: 12px; gap: 8px; border-radius: 9px; }
  .main { padding-top: 12px; }
  .btn { padding: 5px 10px; font-size: 0.84rem; }
  .seg-btn { padding: 4px 8px; font-size: 0.8rem; }
  .toolbar, .nav-group, .filters { gap: 6px; }
  .lede { font-size: 0.85rem; }
  .stat { padding: 10px 12px; flex-basis: 50%; }
  .stat-n { font-size: 1.4rem; }
  .stat-l { font-size: 0.8rem; }
  .stat-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .stage-seg { flex-basis: 84px; padding: 6px 8px; }
  .stage-seg .n { font-size: 1rem; }
  .task-row { padding: 6px 8px 6px 10px; }
  .task-meta { font-size: 0.74rem; }
  .vcard { padding: 10px; gap: 6px; }
  .vcard-title { font-size: 0.92rem; }
  .vcard-meta { font-size: 0.8rem; }
  .vcards { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .vidid.big { font-size: 0.86rem; }
  .pipe-item { padding: 7px 8px; }
  .health-list { gap: 10px; }
  .issues { font-size: 0.8rem; }
  .tbl { font-size: 0.8rem; }
  .tbl th, .tbl td { padding: 5px 7px; }
  .input { padding: 6px 8px; }
  .drawer-head { padding: 12px 14px 8px; }
  .drawer-body { padding: 12px 14px 18px; gap: 10px; }
  .drawer-foot { padding: 8px 14px; }
  .drawer-head h2 { font-size: 1.05rem; }
  .pweek .day { padding: 6px; }
  .legend { font-size: 0.7rem; gap: 4px 10px; }
  .film-row { grid-template-columns: minmax(0, 1fr) auto; }
  .film-done { grid-column: 1 / -1; justify-self: start; order: 3; }
  .nav-btn { font-size: 0.6rem; padding: 5px 2px; }
  .nav-btn svg { width: 17px; height: 17px; }
}
@media (max-width: 760px) {
  h1 { font-size: 1.2rem; }
  .pweek .day.empty-day { display: none; }
  .pweek .day { min-height: 0; }
  .toast:not(:last-child) { display: none; }
  .film-row { padding: 6px; gap: 6px; }
  .film-meta .input.date { width: 118px; font-size: 0.78rem; padding: 3px 6px; }
  .film-meta .place-in { width: 96px !important; font-size: 0.76rem; padding: 3px 8px; }
  .film-meta .film-when:not(.bad) { display: none; }
  .film-done { padding: 3px 8px; font-size: 0.76rem; }
  .film-add .input.date { width: 118px; }
  .film-add .place-in { width: 96px !important; }
  .idea-pick-sm select { max-width: 100%; font-size: 0.8rem; }
  .task-title { font-size: 0.9rem; }
  .card-head h2 .muted { display: block; margin-left: 0; margin-top: 2px; }
}
@media (max-width: 760px) {
  .stat-row .stat .small { display: none; }
  .stat-row .stat { padding: 8px 10px; }
  .stat-row .stat-l { font-size: 0.72rem; font-weight: 600; line-height: 1.25; }
  .stat-row .stat-n { font-size: 1.2rem; }
}

/* Editing timer */
.timerbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 8px 12px; margin: -8px auto 14px; max-width: 1280px; border-radius: var(--r); background: var(--ink); color: var(--bg); box-shadow: 0 6px 20px rgb(0 0 0 / 0.18); }
.timerbar.over { background: var(--behind); color: #fff; }
.timerbar .vidid { background: rgb(255 255 255 / 0.18); color: inherit; }
.tb-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgb(255 255 255 / 0.15); }
.timerbar.over .tb-dot { background: #fff; }
.tb-time { font-family: var(--f-mono); font-weight: 600; font-variant-numeric: tabular-nums; font-size: 1.05rem; }
.tb-what { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1 1 180px; }
.tb-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.86rem; opacity: 0.85; }
.tb-meta { font-size: 0.8rem; opacity: 0.85; }
.timerbar .btn.ghost { color: inherit; }
.timerbar .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* Editing time + upload info panels */
.ui-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.ui-head .sec-h { margin-top: 0; }
.edit-time, .upload-info { display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px; }
.et-bars { display: flex; flex-direction: column; gap: 6px; }
.et-bar { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.et-bar span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.et-bar span.over { background: var(--behind); }
.et-nums { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 0.86rem; font-variant-numeric: tabular-nums; }
.et-blocks { display: flex; gap: 4px; }
.et-block { flex: 1; height: 20px; border-radius: 4px; border: 1.5px dashed var(--line-2); }
.et-block.used { background: var(--t-myEdit); border: 0; }
.et-block.long { box-shadow: inset 0 -4px 0 var(--risk); }
.et-block.extra { background: var(--behind); border: 0; }
.et-add { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.num-sm { width: 64px !important; }
.et-log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 0.86rem; }
.et-log li { display: grid; grid-template-columns: 110px 70px 1fr auto; gap: 8px; align-items: center; }
.tabnum { font-variant-numeric: tabular-nums; }
.ui-hint { display: inline-flex; gap: 10px; align-items: center; }
.vcard-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.mini-chip { font-size: 0.74rem; font-weight: 600; padding: 1px 8px; border-radius: 99px; background: var(--surface-2); color: var(--ink-2); }
.mini-chip.ok { color: var(--ok); background: color-mix(in oklab, var(--ok) 12%, var(--surface)); }
.mini-chip.bad { color: var(--behind); background: color-mix(in oklab, var(--behind) 12%, var(--surface)); }
.muted-link { color: var(--ink-3); }
.task-hrs { display: inline-flex; gap: 8px; align-items: center; }
@media (max-width: 760px) {
  .timerbar { margin: -4px 0 10px; padding: 6px 10px; }
  .tb-meta { flex-basis: 100%; }
  .et-log li { grid-template-columns: 96px 60px 1fr auto; }
  .task-hrs .btn { padding: 3px 7px; font-size: 0.72rem; }
}

/* Sign-in (web version) */
.auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); }
.auth-card { width: min(400px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 26px 22px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 10px 40px rgb(0 0 0 / 0.06); }
.auth-card h1 { font-size: 1.4rem; }
.auth-brand { display: flex; gap: 10px; align-items: center; }
.auth-brand strong { font-family: var(--f-display); font-size: 1.1rem; display: block; line-height: 1.1; }
.auth-brand small { color: var(--ink-3); font-size: 0.78rem; }
.auth-card .btn.primary { padding: 10px; font-size: 0.95rem; }
.auth-links { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 0.88rem; }
.auth-ok { font-size: 0.86rem; color: var(--ok); }

</style>
